<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E1B4B">
<title>Snow Kingdom Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#B9E3FF; --sky-bot:#F0F9FF; --panel:#FFFFFF; --panel-2:#EEF7FF; --line:#C3DFF2;
  --text:#1D2357; --muted:#4E5889; --pop:#C42A70; --pop-soft:#FFE1EF; --mint:#0B7F69; --mint-soft:#D4F8EE;
  --gold:#A86F00; --gold-line:#E9A300; --gold-soft:#FFF0C4; --ice:#2373B3; --ice-soft:#DCEFFF;
  --rock:#86A6D6; --rock-2:#5F80B4; --snow:#FFFFFF; --join:#E2559B; --on-accent:#FFFFFF; --shadow:rgba(29,35,87,.14);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#141649; --sky-bot:#29297A; --panel:#23286B; --panel-2:#2C327C; --line:#454DA3;
    --text:#F3F6FF; --muted:#BAC2EE; --pop:#FF73B8; --pop-soft:#4C2763; --mint:#45E3C2; --mint-soft:#1B4D5C;
    --gold:#FFCB45; --gold-line:#FFCB45; --gold-soft:#4C4231; --ice:#83CEFF; --ice-soft:#26407A;
    --rock:#5A6FB0; --rock-2:#3E4F8F; --snow:#EEF6FF; --join:#FF7DBB; --on-accent:#12153F; --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-top:#141649; --sky-bot:#29297A; --panel:#23286B; --panel-2:#2C327C; --line:#454DA3;
  --text:#F3F6FF; --muted:#BAC2EE; --pop:#FF73B8; --pop-soft:#4C2763; --mint:#45E3C2; --mint-soft:#1B4D5C;
  --gold:#FFCB45; --gold-line:#FFCB45; --gold-soft:#4C4231; --ice:#83CEFF; --ice-soft:#26407A;
  --rock:#5A6FB0; --rock-2:#3E4F8F; --snow:#EEF6FF; --join:#FF7DBB; --on-accent:#12153F; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:var(--sky-bot)}
body{margin:0;min-height:100vh;font-family:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;font-size:18px;
  color:var(--text);background:linear-gradient(180deg,var(--sky-top),var(--sky-bot) 70vh,var(--sky-bot));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-line);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:2.1rem;font-weight:700;margin:0;letter-spacing:.01em}
h2{font-size:1.8rem;margin:0 0 8px}
p{margin:0 0 10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.btn{border:0;border-radius:16px;padding:.75em 1.25em;background:var(--ice);color:var(--on-accent);font-weight:600;font-size:1.1rem;
  cursor:pointer;box-shadow:0 4px 0 var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.btn.pop{background:var(--pop)}
.btn.ghost{background:var(--panel);color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn.sm{font-size:.95rem;padding:.5em .9em}
.btn.big{font-size:1.3rem;padding:.85em 1.6em}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:var(--panel);border-radius:26px;padding:22px;box-shadow:0 6px 0 var(--line)}
.flakes{font-weight:700;font-size:1.2rem;background:var(--panel);border-radius:999px;padding:.35em .8em;border:2px solid var(--line);white-space:nowrap}

/* home */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:8px 0 6px}
.hi{color:var(--muted);font-size:1.15rem;margin-top:4px}
.callout{margin:16px 0}
.trail{list-style:none;margin:22px auto 10px;padding:0;max-width:640px;position:relative}
.trail::before{content:"";position:absolute;left:50%;top:20px;bottom:20px;border-left:5px dotted var(--snow);transform:translateX(-50%);z-index:0}
.stop{position:relative;z-index:1;margin:0 0 14px}
.stop:nth-child(odd){padding-right:18%}
.stop:nth-child(even){padding-left:18%}
.stop button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:3px solid var(--line);
  border-radius:22px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
.disc{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--ice);color:var(--on-accent);font-weight:700;font-size:1.5rem}
.stop .t{display:flex;flex-direction:column;line-height:1.2}
.stop .t b{font-size:1.2rem}
.stop .t small{color:var(--muted);font-size:.95rem;margin-top:2px}
.stars{margin-left:auto;color:var(--gold);font-size:1.25rem;letter-spacing:2px;white-space:nowrap}
.stop.done .disc{background:var(--mint)}
.stop.next button{border-color:var(--pop)}
.stop.next .disc{background:var(--pop)}
.stop.locked button{opacity:.5;cursor:not-allowed;box-shadow:none}
.foot{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:20px}
.routine{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;list-style:none;padding:0;margin:0}
.routine li{background:var(--panel);border-radius:999px;padding:.35em .9em;border:2px solid var(--line);font-weight:600}
.routine li span{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ice-soft);margin-right:6px;font-size:.9em}
.grown{position:relative;overflow:hidden;background:transparent;border:2px dashed var(--line);border-radius:14px;padding:.5em 1em;color:var(--muted);cursor:pointer;font-size:.95rem}
.grown::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--pop)}
.grown.holding::after{width:100%;transition:width 2s linear}

/* play */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.dots{display:flex;gap:7px}
.d5{width:18px;height:18px;border-radius:50%;background:var(--panel);border:3px solid var(--line)}
.d5.ok{background:var(--mint);border-color:var(--mint)}
.d5.miss{background:var(--gold-line);border-color:var(--gold-line)}
.d5.cur{border-color:var(--pop)}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 12px}
.steps li{flex:1;text-align:center;padding:.4em .2em;border-radius:999px;background:var(--panel-2);color:var(--muted);font-weight:600;font-size:.98rem}
.steps li.on{background:var(--ice);color:var(--on-accent)}
.steps li.done{background:var(--mint-soft);color:var(--mint)}
.story{background:var(--panel);border-radius:26px;padding:18px 22px;box-shadow:0 6px 0 var(--line);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.story .em{font-size:3rem;line-height:1}
.story p{font-size:1.55rem;line-height:1.45;margin:0 0 10px;max-width:34em}
.n{background:var(--gold-soft);padding:0 .22em;border-radius:8px;font-weight:700}
.work{background:var(--panel);border-radius:26px;padding:20px;margin-top:16px;text-align:center;box-shadow:0 6px 0 var(--line)}
.prompt{font-size:1.4rem;font-weight:600;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 14px}
.hint{margin:14px auto 0;font-size:1.15rem;color:var(--pop);min-height:1.4em;max-width:36em;font-weight:500}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));max-width:720px;margin:12px auto 0}
.choices.two{grid-template-columns:1fr 1fr;max-width:460px}
.choice{background:var(--panel-2);border:3px solid var(--line);border-radius:18px;padding:16px 14px;font-size:1.25rem;font-weight:600;cursor:pointer;min-height:64px}
.choice:hover{border-color:var(--ice)}
.choice.right{border-color:var(--mint);background:var(--mint-soft)}
.choice.wrong{border-color:var(--pop);background:var(--pop-soft);animation:shake .35s}
.choice:disabled{cursor:default}
.eqs .choice{font-size:1.7rem}
.eq{display:inline-flex;gap:.35em;align-items:center;font-weight:700;letter-spacing:.02em}
.box{display:inline-block;width:1em;height:1.1em;border:3px solid currentColor;border-radius:6px}
.eqbig{font-size:2.2rem;margin:4px 0 12px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* math mountain */
.mtn{position:relative;width:min(360px,100%);aspect-ratio:360/230;margin:10px auto 6px}
.mtn svg{position:absolute;inset:0;width:100%;height:100%}
.mtn.sm{width:min(250px,100%)}
.slot{position:absolute;transform:translate(-50%,-50%);width:76px;height:60px;border-radius:14px;border:3px dashed var(--ice);
  background:var(--panel);font-size:1.75rem;font-weight:700;display:grid;place-items:center;cursor:pointer;padding:0}
.mtn.sm .slot{width:58px;height:46px;font-size:1.3rem;cursor:default}
.slot.filled{border-style:solid;background:var(--gold-soft);border-color:var(--gold-line)}
.slot.right{border-color:var(--mint);background:var(--mint-soft)}
.s-top{left:50%;top:46%}
.s-l{left:25%;top:80%}
.s-r{left:75%;top:80%}
.tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0 6px;min-height:66px}
.tile{min-width:74px;height:62px;padding:0 14px;border-radius:16px;background:var(--gold-soft);border:3px solid var(--gold-line);font-size:1.75rem;font-weight:700;cursor:pointer;transition:transform .1s}
.tile.sel{transform:translateY(-6px);background:var(--gold-line);color:#2A1C00;box-shadow:0 6px 0 var(--shadow)}
.tile.used{visibility:hidden}
.tile.picked{background:var(--mint-soft);border-color:var(--mint)}

/* comparison bars */
.bars{display:grid;gap:14px;max-width:560px;margin:12px auto}
.barrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.who{font-weight:700;font-size:1.15rem;text-align:right;overflow-wrap:anywhere}
.bar{display:flex;height:70px;gap:0}
.seg{display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--ice-soft);border:3px solid var(--ice)}
.seg.extra{border:3px dashed var(--pop);background:transparent;margin-left:4px}
.seg .slot{position:static;transform:none;width:68px;height:52px}
.bars.sm .seg{height:52px}
.bars.sm .seg .slot{width:52px;height:40px;font-size:1.2rem;cursor:default}
.extra-note{font-size:.9rem;color:var(--pop);text-align:right;margin-top:-6px}

/* circles */
.frames{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0}
.frame{display:grid;grid-template-columns:repeat(5,52px);gap:8px;padding:10px;background:var(--panel-2);border-radius:18px;border:2px solid var(--line)}
.cell{width:52px;height:52px;border-radius:50%;border:2px dashed var(--line);background:transparent;padding:0;cursor:pointer;position:relative}
.cell.s{background:var(--ice);border:0}
.cell.j{background:var(--join);border:0}
.cell.x{opacity:.45}
.cell.x::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;font-weight:700;color:var(--pop);opacity:1}
.frames.sm .frame{grid-template-columns:repeat(5,30px);gap:5px;padding:6px}
.frames.sm .cell{width:30px;height:30px;cursor:default}
.frames.sm .cell.x::after{font-size:1.2rem}
.count{font-size:1.4rem;font-weight:700;margin:6px 0 10px}

/* sticks and dots */
.sdwrap{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.sd{display:inline-flex;align-items:flex-end;gap:5px;padding:8px 12px;background:var(--panel-2);border-radius:14px}
.stick{width:7px;height:42px;background:var(--ice);border-radius:4px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--join);margin-bottom:2px}
.sd b{margin-left:8px;font-size:1.3rem}

/* pad */
.padshow{font-size:2.6rem;font-weight:700;margin:6px 0 10px;min-height:1.3em}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-content:center}
.pad button{height:62px;border-radius:16px;border:2px solid var(--line);background:var(--panel-2);font-size:1.6rem;font-weight:700;cursor:pointer}
.pad button.go{background:var(--mint);color:var(--on-accent);border-color:var(--mint);font-size:1.15rem}
.pad button:disabled{opacity:.4}

/* win, intro, results */
.win .tick{font-size:3.4rem;color:var(--mint);line-height:1}
.win .answer{font-size:2.2rem;font-weight:700;margin:4px 0}
.gain{font-weight:700;color:var(--ice);font-size:1.3rem}
.intro .idea{font-size:1.4rem;line-height:1.45;max-width:34em}
.ex{margin:14px 0;padding:14px 18px;background:var(--panel-2);border-left:6px solid var(--ice);border-radius:12px;font-size:1.2rem;line-height:1.45}
.result{text-align:center}
.result .big{font-size:3rem;font-weight:700;margin:6px 0}
.lead{font-size:1.2rem;color:var(--muted)}
.eqline{font-size:1.8rem;font-weight:700;min-height:1.3em;margin:8px 0}

/* parent */
.ptable-wrap{overflow-x:auto;margin:10px 0 18px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.chip{display:inline-block;white-space:nowrap;border-radius:999px;padding:.15em .7em;font-weight:600;font-size:.95rem;background:var(--panel-2)}
.chip.m{background:var(--mint-soft);color:var(--mint)}
.chip.p{background:var(--gold-soft);color:var(--gold)}
.settings label{display:flex;align-items:center;gap:10px;margin:10px 0}
.settings input[type=text]{font:inherit;padding:.4em .6em;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);color:var(--text)}
.danger{border:2px solid var(--pop);border-radius:18px;padding:14px 16px;margin-top:18px}
.danger input{font:inherit;padding:.45em .6em;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);color:var(--text)}
.warn{background:var(--gold-soft);border-radius:12px;padding:10px 14px}
section+section{margin-top:16px}

.snowfall{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.snowfall span{position:absolute;top:-40px;color:#fff;text-shadow:0 0 6px #4FAEEA;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(260deg)}}

@media (max-width:620px){
  body{font-size:17px}
  .stop:nth-child(odd){padding-right:6%}
  .stop:nth-child(even){padding-left:6%}
  .story{grid-template-columns:1fr}
  .story .em{font-size:2.2rem}
  .story p{font-size:1.35rem}
  .frame{grid-template-columns:repeat(5,44px);gap:6px}
  .cell{width:44px;height:44px}
  .steps li{font-size:.85rem}
  .barrow{grid-template-columns:70px 1fr}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
/* learning hub: leave room for the 🏠 button in the top-left corner */
.wrap{padding-top:78px}
</style>
</head>
<body>
<main id="app"></main>
<script src="../../shared/hub.js" data-game="snow-kingdom-stories"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const app = $('#app');
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const timers = new Set();
const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; };

/* ---------------- storage ---------------- */
const KEY = 'snow-kingdom-stories-v1';
const fresh = () => ({
  v: 1, kidName: 'Anvesha', placementDone: false, placement: null, unlocked: 1, snowflakes: 0, levels: {},
  mistakes: { addedAll: 0, totalSpot: 0, moreAdd: 0, label: 0, sort: 0, draw: 0 },
  settings: { voice: true, rate: 0.92, numberless: true, unlockAll: false }, log: []
});
let S = fresh(); let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw); const f = fresh();
      S = Object.assign(f, d, {
        settings: Object.assign(f.settings, d.settings || {}),
        mistakes: Object.assign(f.mistakes, d.mistakes || {}),
        levels: d.levels || {}, log: d.log || []
      });
    }
  } catch (e) { storageOK = false; S = fresh(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
function lv(n) { return S.levels[n] || (S.levels[n] = { rounds: 0, best: 0, mastered: false, attempts: 0, firstTry: 0, recent: [] }); }
const unlockedMax = () => S.settings.unlockAll ? 8 : Math.max(1, Math.min(8, S.unlocked));
const kid = () => (S.kidName || '').trim() || 'friend';

/* ---------------- voice ---------------- */
const Voice = {
  v: null,
  init() {
    if (!('speechSynthesis' in window)) return;
    const choose = () => {
      const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
      const prefs = [/samantha/i, /aria/i, /jenny/i, /ava/i, /allison/i, /zira/i, /susan/i, /victoria/i, /karen/i, /moira/i, /tessa/i, /serena/i, /female/i, /google us english/i, /google uk english female/i];
      for (const p of prefs) { const f = vs.find(v => p.test(v.name)); if (f) { this.v = f; return; } }
      this.v = vs[0] || null;
    };
    choose();
    try { speechSynthesis.addEventListener('voiceschanged', choose); } catch (e) { speechSynthesis.onvoiceschanged = choose; }
  },
  say(t, queue) {
    if (!S.settings.voice || !('speechSynthesis' in window) || !t) return;
    try {
      if (!queue) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(t).replace(/☐/g, 'mystery number').replace(/−/g, ' minus ').replace(/ \+ /g, ' plus ').replace(/ = /g, ' equals '));
      if (this.v) u.voice = this.v;
      u.rate = S.settings.rate; u.pitch = 1.08;
      speechSynthesis.speak(u);
    } catch (e) {}
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} }
};

/* ---------------- story content ---------------- */
const PEOPLE = [['Mia','she'],['Leo','he'],['Ava','she'],['Riya','she'],['Arjun','he'],['Maya','she'],['Ravi','he'],['Zoe','she'],['Sam','he'],['Lily','she'],['Nina','she'],['Kai','he'],['Ben','he'],['Priya','she'],['Omar','he'],['Ella','she']];
function person() { return Math.random() < 0.2 ? [kid(), 'she'] : pick(PEOPLE); }
function twoPeople() { const a = person(); let b; do { b = pick(PEOPLE); } while (b[0] === a[0]); return [a, b]; }

const PLACE = [
  { item:'frogs', place:'on a log', join:'hopped on', leave:'hopped off', e:'🐸' },
  { item:'ducks', place:'in the pond', join:'swam in', leave:'swam away', e:'🦆' },
  { item:'birds', place:'on the wire', join:'landed', leave:'flew away', e:'🐦' },
  { item:'kids', place:'on the bus', join:'got on', leave:'got off', e:'🚌' },
  { item:'bees', place:'on the flower', join:'buzzed in', leave:'buzzed away', e:'🐝' },
  { item:'penguins', place:'on the ice', join:'slid over', leave:'waddled away', e:'🐧' },
  { item:'bunnies', place:'in the garden', join:'hopped in', leave:'hopped home', e:'🐰' },
  { item:'snowflakes', place:'on the window', join:'landed', leave:'melted', e:'❄️' },
  { item:'sleds', place:'on the hill', join:'zoomed up', leave:'slid down', e:'🛷' },
  { item:'owls', place:'in the tree', join:'flew in', leave:'flew off', e:'🦉' }
];
const OWN = [
  { item:'stickers', got:'got {n} more', get:'get', gave:'gave away {n}', give:'give away', e:'⭐' },
  { item:'beads', got:'got {n} more', get:'get', gave:'used {n}', give:'use', e:'📿' },
  { item:'crayons', got:'got {n} more', get:'get', gave:'gave {n} to a friend', give:'give to a friend', e:'🖍️' },

function opts(ok, ...ds) {
  const seen = new Set([ok.join(' ')]); const out = [{ t: ok, ok: true }];
  ds.forEach(d => { const k = d.t.join(' '); if (!seen.has(k)) { seen.add(k); out.push(d); } });
  return shuffle(out);
}

function mkTwoDigit() {

function split(lo, hi) { const C = rnd(lo, hi); const a = rnd(2, C - 2); return [a, C - a, C]; }
function gen(type, max) {
  switch (type) {
    case 'join_res': { const [a, b] = split(4, max); return mkJoinRes(randStory(), a, b); }
    case 'leave_res': { const [, b, A] = split(4, max); return mkLeaveRes(randStory(), A, b); }
    case 'join_chg': { const [a, b] = split(5, max); return mkJoinChg(randStory(), a, b); }
    case 'leave_chg': { const [, b, A] = split(5, max); return mkLeaveChg(randStory(), A, b); }
    case 'join_start': { const [a, b] = split(5, max); return mkJoinStart(randStory(), a, b); }
    case 'leave_start': { const [, b, A] = split(5, max); return mkLeaveStart(randStory(), A, b); }
    case 'put_total': { const [a, b] = split(5, max); return mkPutTotal(pick(GROUPS), a, b); }
    case 'apart': { const [a, b] = split(5, max); return mkApart(pick(GROUPS), a, b); }
    case 'cmp_diff': { const [[N1], [N2]] = twoPeople(); const B = rnd(5, max), s = rnd(2, B - 2); return mkCmpDiff(pick(CMP), N1, N2, B, s, Math.random() < 0.35); }
    case 'cmp_big': { const [[N1], [N2]] = twoPeople(); const s = rnd(2, max - 3), d = rnd(2, Math.min(9, max - s)); return mkCmpBig(pick(CMP), N1, N2, s, d); }
    case 'cmp_small': { const [[N1, p1], [N2]] = twoPeople(); const B = rnd(6, max), d = rnd(2, B - 2); return mkCmpSmall(pick(CMP), N1, p1, N2, B, d, Math.random() < 0.65); }
    case 'three': return mkThree();
    case 'two_digit': return mkTwoDigit();
    case 'two_step': return mkTwoStep();
  }
  throw new Error('Unknown type ' + type);
}

function pad(el, onSubmit) {
  let v = '';
  el.innerHTML = `<div class="padshow" aria-live="polite"><span class="padval">?</span></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d => `<button data-d="${d}">${d}</button>`).join('')}<button data-d="back" aria-label="Delete">⌫</button><button data-d="0">0</button><button data-d="ok" class="go">Check</button></div>`;
  const show = () => { el.querySelector('.padval').textContent = v || '?'; };
  const api = { clear() { v = ''; show(); }, disable() { $$('button', el).forEach(b => b.disabled = true); keyHandler = null; } };
  const press = d => {
    if (d === 'back') v = v.slice(0, -1);
    else if (d === 'ok') { if (v !== '') onSubmit(parseInt(v, 10), api); return; }
    else if (v.length < 2) v = (v === '0' ? '' : v) + d;

  $$('.pad button', el).forEach(b => b.onclick = () => { b.blur(); press(b.dataset.d); });
  keyHandler = e => {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); press('ok'); }
  };

}
// Tap a tile, then tap a spot. judge(got) -> {ok:true} | {msg, solution}
function slotGame(root, values, keys, judge, onDone) {
  const tiles = shuffle(values.map(String)).map((v, i) => ({ i, v }));
  const slots = {}; keys.forEach(k => slots[k] = null);
  let sel = null, wrongs = 0, finished = false;
  const tray = $('#tray', root), chk = $('#chk', root), hint = $('#hint', root);
  const slotEl = k => root.querySelector(`.slot[data-k="${k}"]`);
  function paint() {
    const used = Object.values(slots);
    tray.innerHTML = tiles.map(t => { const u = used.includes(t.i); return `<button class="tile ${sel === t.i ? 'sel' : ''} ${u ? 'used' : ''}" data-i="${t.i}" ${u || finished ? 'disabled' : ''} aria-label="${t.v === '?' ? 'mystery number' : t.v}" aria-pressed="${sel === t.i}">${valHTML(t.v)}</button>`; }).join('');
    keys.forEach(k => { const el = slotEl(k); el.innerHTML = slots[k] == null ? '' : valHTML(tiles[slots[k]].v); el.classList.toggle('filled', slots[k] != null); });
    chk.disabled = finished || keys.some(k => slots[k] == null);
    $$('.tile', tray).forEach(b => b.onclick = () => { sel = sel === +b.dataset.i ? null : +b.dataset.i; paint(); });
  }
  keys.forEach(k => {
    slotEl(k).onclick = () => {
      if (finished) return;
      if (slots[k] != null) { slots[k] = null; paint(); return; }
      if (sel == null) { hint.textContent = 'Tap a number first, then tap this spot.'; return; }
      slots[k] = sel; sel = null; hint.textContent = ''; paint();
    };
  });
  chk.onclick = () => {
    const got = {}; keys.forEach(k => got[k] = tiles[slots[k]].v);
    const res = judge(got);
    if (res.ok) {
      finished = true; keys.forEach(k => slotEl(k).classList.add('right')); paint(); onDone(false); return;
    }
    wrongs++;
    if (wrongs >= 2) {
      const free = tiles.map(t => t.i);
      keys.forEach(k => { const idx = free.findIndex(i => tiles[i].v === String(res.solution[k])); slots[k] = free.splice(idx, 1)[0]; });
      finished = true; paint(); keys.forEach(k => slotEl(k).classList.add('right'));
      const m = res.msg + ' Here’s how it goes.'; hint.textContent = m; Voice.say(m); onDone(true);
    } else {
      keys.forEach(k => slots[k] = null); sel = null; paint(); hint.textContent = res.msg; Voice.say(res.msg);
    }
  };
  paint();
}
function markChoices(w) { $$('.choice', w).forEach(b => b.disabled = true); }

  g.addEventListener('pointerdown', start);

function placement() {
  let i = 0; const res = [];

    const q = PLACEMENT[i];
    screen(`<div class="wrap">
      <div class="bar"><button class="btn ghost sm" id="quit">Back to trail</button><div class="dots">${PLACEMENT.map((_, k) => `<span class="d5 ${k < i ? 'ok' : ''} ${k === i ? 'cur' : ''}"></span>`).join('')}</div><span></span></div>

    else if ([0,1,2].every(ok)) { unlock = 2; startAt = 1; msg = 'Great start! Begin with trail 1. Trail 2 is open too.'; }
    else { msg = 'Let’s start at the very beginning, with trail 1.'; }
    S.unlocked = Math.max(S.unlocked, unlock); S.placementDone = true;
    S.placement = { date: new Date().toISOString().slice(0, 10), res, startAt }; save();
    screen(`<div class="wrap"><section class="card result"><p class="big">❄</p><h2>All done!</h2><p class="intro idea" style="margin:0 auto 18px">${msg}</p>
      <div class="row center"><button class="btn pop big" id="go">Go to trail ${startAt}</button><button class="btn ghost" id="home">See the trail map</button></div></section></div>`);

/* ---------------- a round of stories ---------------- */
let P = null;
function buildRound(level) {
  const L = LEVELS[level - 1];
  if (level === 8) {
    const pool = shuffle(['join_chg','leave_chg','apart','join_start','leave_start','cmp_diff','cmp_big','cmp_small','three','two_digit','put_total','leave_res','join_res']);
    const arr = pool.slice(0, 4).map(t => gen(t, 20));
    arr.splice(rnd(2, 4), 0, gen('two_step', 20));
    return arr;
  }
  const types = shuffle(L.types); const cur = [];
  for (let i = 0; i < 4; i++) cur.push(gen(types[i % types.length], L.max));
  const list = shuffle(cur);
  if (level > 1) { const R = LEVELS[rnd(1, level - 1) - 1]; const r = gen(pick(R.types), R.max); r.review = true; list.splice(2, 0, r); }
  else list.push(gen(pick(L.types), L.max));
  return list;
}
function startRound(level) { Voice.stop(); P = { level, list: buildRound(level), idx: 0, results: [] }; intro(level); }

function flowFor(p) {

function drawCircles() {

  const words = () => {

function writeStep(which) {

function analyze(p, x) {
  let pre = '';
  const sumAll = p.nums.reduce((a, b) => a + b, 0);
  if (p.model !== 'three' && x === sumAll && p.answer !== sumAll) {
    if (p.type === 'cmp_small') { S.mistakes.moreAdd++; pre = 'Careful! “More” doesn’t always mean add. '; }
    else { S.mistakes.addedAll++; pre = 'It looks like you added all the numbers. '; }
  } else if (p.partUnknown && x > p.total) {
    pre = `Your answer is bigger than the total, ${p.total}. A partner can’t be bigger than the whole mountain! `;
  }
  save();
  return pre + p.rb(x) + (p.noSense ? ' Try again.' : ' Does that make sense? Try again.');
}
function roundEnd() {
  const score = P.results.filter(Boolean).length, n = P.list.length, L = lv(P.level);
  L.rounds++; L.best = Math.max(L.best, score); L.attempts += n; L.firstTry += score; L.recent = [...(L.recent || []), score].slice(-5);
  let newly = false;
  if (score >= 4 && !L.mastered) { L.mastered = true; newly = true; }
  if (score >= 4 && P.level < 8 && S.unlocked < P.level + 1) S.unlocked = P.level + 1;
  S.log.push({ d: new Date().toISOString().slice(0, 10), level: P.level, score, n }); if (S.log.length > 300) S.log = S.log.slice(-300);
  save();
  const msg = score >= 4
    ? (newly ? (P.level < 8 ? `Trail ${P.level} mastered! Trail ${P.level + 1} is open.` : 'You finished every trail! You’re a word problem expert.') : 'Great round! You read every story carefully.')
    : score === 3 ? 'So close! One more round and you’ve got it.'
    : 'Stories can be tricky. Every round makes you stronger. Let’s try this trail again.';
  const canNext = P.level < 8 && unlockedMax() >= P.level + 1;
  screen(`<div class="wrap"><section class="card result">
    <p class="big" aria-label="${score} out of ${n}">${'❄'.repeat(score)}<span style="opacity:.25">${'❄'.repeat(n - score)}</span></p>
    <h2>${score} of ${n} stories right on the first try</h2><p class="intro idea" style="margin:0 auto 18px">${esc(msg)}</p>
    <div class="row center">${canNext ? `<button class="btn pop big" id="nextL">Go to trail ${P.level + 1}</button>` : ''}
      <button class="btn ${canNext ? 'ghost' : 'pop big'}" id="again">Play this trail again</button><button class="btn ghost" id="home">Back to trail map</button></div>
  </section></div>`);
  Voice.say(`${score} of ${n} on the first try. ${msg}`);

      <label><input type="checkbox" id="sn" ${S.settings.numberless ? 'checked' : ''}> Start trail 1 stories without numbers (numberless word problems)</label>
      <label><input type="checkbox" id="su" ${S.settings.unlockAll ? 'checked' : ''}> Open every trail</label>
      <label>Child’s name <input type="text" id="sk" value="${esc(S.kidName)}" maxlength="20"></label>
      <div class="row"><button class="btn ghost sm" id="replace">Take the placement check again</button></div>
      <div class="danger"><p><b>Start again</b> erases all progress, stars, and snowflakes on this computer. Type START AGAIN to unlock the button.</p>
        <div class="row"><input type="text" id="sa" aria-label="Type START AGAIN"><button class="btn pop" id="reset" disabled>Erase and start again</button></div></div>
    </section></div>`);
  $('#done').onclick = home;
  $('#sv').onchange = e => { S.settings.voice = e.target.checked; save(); };
  $('#sr').oninput = e => { S.settings.rate = parseFloat(e.target.value); save(); };
  $('#test').onclick = () => { const was = S.settings.voice; S.settings.voice = true; Voice.say(`Hi ${kid()}! Let’s read a story together.`); S.settings.voice = was; };
  $('#sn').onchange = e => { S.settings.numberless = e.target.checked; save(); };
  $('#su').onchange = e => { S.settings.unlockAll = e.target.checked; save(); };
  $('#sk').oninput = e => { S.kidName = e.target.value.slice(0, 20); save(); };
  $('#replace').onclick = placement;
  $('#sa').oninput = e => { $('#reset').disabled = e.target.value.trim().toUpperCase() !== 'START AGAIN'; };
  $('#reset').onclick = () => { const name = S.kidName; S = fresh(); S.kidName = name; save(); home(); };
}

/* ---------------- boot ---------------- */
load(); Voice.init(); home();
window.__SKS = { gen, LEVELS, buildRound, get S() { return S; }, get P() { return P; } };
})();
</script>
</body>
</html>
