<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Keep these meta tags: they make the game fit the iPad screen and stay full-screen from the Home Screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E1B4B">
<title>Pet Puzzle Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Grandstander:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#CDEFFF; --meadow:#E6F7D9; --grass:#9BD77F; --panel:#FFFFFF; --panel-2:#FFF7EC; --line:#EAD6BA;
  --text:#2B2140; --muted:#5E5470; --pop:#C2410C; --pop-dark:#8A2E08; --pop-soft:#FFE8DA;
  --leaf:#15803D; --leaf-soft:#DCFCE7; --sky:#1D6FB8; --sky-dark:#124A7C; --sky-soft:#DDEFFF;
  --gold:#A16207; --gold-fill:#FCD34D; --hmm-soft:#FFF4CC; --dim:0.38; --on-accent:#FFFFFF;
  --shadow:rgba(43,33,64,.16); --collar-red:#DC2626; --collar-blue:#2563EB;
  --font-display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --font-body:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;
  --fs-title:44px; --fs-pip:30px; --fs-clue:28px; --fs-btn:26px; --fs-label:22px; --fs-body:18px; --fs-small:18px;
  --pet-sm:64px; --pet-md:76px; --pet-lg:88px;
  --r-xl:32px; --r-lg:26px; --r-md:20px; --r-sm:14px; --r-pill:999px; --gap:16px; --gap-lg:24px;
  --card-lift:0 6px 0 var(--line);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#1E1B4B; --meadow:#173A3F; --grass:#2F6B4F; --panel:#2A2560; --panel-2:#332E72; --line:#4A4596;
    --text:#FFF8EE; --muted:#C9C2E8; --pop:#FF9A62; --pop-dark:#B85A2A; --pop-soft:#4A2E4E;
    --leaf:#5EE3A1; --leaf-soft:#1D4D45; --sky:#7CC4FF; --sky-dark:#3F7DB8; --sky-soft:#26407A;
    --gold:#FFCB45; --gold-fill:#FFCB45; --hmm-soft:#4C4231; --on-accent:#1E1B4B; --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-top:#1E1B4B; --meadow:#173A3F; --grass:#2F6B4F; --panel:#2A2560; --panel-2:#332E72; --line:#4A4596;
  --text:#FFF8EE; --muted:#C9C2E8; --pop:#FF9A62; --pop-dark:#B85A2A; --pop-soft:#4A2E4E;
  --leaf:#5EE3A1; --leaf-soft:#1D4D45; --sky:#7CC4FF; --sky-dark:#3F7DB8; --sky-soft:#26407A;
  --gold:#FFCB45; --gold-fill:#FFCB45; --hmm-soft:#4C4231; --on-accent:#1E1B4B; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  font-family:var(--font-body); font-size:var(--fs-body); font-weight:500; color:var(--text);
  background:var(--meadow) linear-gradient(180deg,var(--sky-top),var(--meadow)) fixed;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
body.lock{overflow:hidden; overscroll-behavior:none}
body.selectable{user-select:text; -webkit-user-select:text; -webkit-touch-callout:default}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; padding:0}
:focus-visible{outline:4px solid var(--gold-fill); outline-offset:4px}
[hidden]{display:none !important}
.sr{position:fixed; top:0; left:0; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
h1,h2,h3{margin:0}
.title{font-family:var(--font-display); font-size:var(--fs-title); font-weight:800; line-height:1.1}

/* ---------- buttons ---------- */
.btn{--btn:var(--panel-2); --btn-dark:var(--line);
  background:var(--btn); box-shadow:0 8px 0 var(--btn-dark); border-radius:var(--r-md);
  min-height:64px; padding:10px 26px; font-size:var(--fs-btn); font-weight:700; color:var(--text);
  transition:transform .08s, box-shadow .08s; line-height:1.15}
.btn:active{transform:translateY(6px); box-shadow:0 2px 0 var(--btn-dark)}
.btn.pop{--btn:var(--pop); --btn-dark:var(--pop-dark); color:var(--on-accent)}
.btn.sky{--btn:var(--sky); --btn-dark:var(--sky-dark); color:var(--on-accent)}
.ghost{background:var(--panel); border:3px solid var(--line); border-radius:var(--r-md); min-height:60px; min-width:60px;
  padding:8px 18px; font-size:22px; font-weight:600; color:var(--text)}
.ghost:active{filter:brightness(.94)}
.tile{--btn:var(--panel-2); --btn-dark:var(--line);
  background:var(--btn); box-shadow:0 8px 0 var(--btn-dark); border-radius:var(--r-md);
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center; position:relative;
  transition:transform .08s, box-shadow .08s, opacity .2s; color:var(--text); line-height:1; flex:0 0 auto}
.tile:active{transform:translateY(6px); box-shadow:0 2px 0 var(--btn-dark)}
.tile small{font-size:var(--fs-label); font-weight:600; margin-top:6px}
.em{display:inline-block; line-height:1; font-size:var(--es,76px)}
.em.sz-s{font-size:calc(var(--es,76px)*.5)} .em.sz-m{font-size:calc(var(--es,76px)*.72)} .em.sz-b{font-size:var(--es,76px)}
.em.flip{transform:scaleX(-1)}
.cw{position:relative; display:inline-block; line-height:1}
.collar{position:absolute; left:50%; bottom:6%; width:22px; height:22px; margin-left:-11px; border-radius:50%; border:3px solid #fff}
.collar.red{background:var(--collar-red)} .collar.blue{background:var(--collar-blue)}
@media (hover:hover){ .tile:hover,.btn:hover{filter:brightness(1.03)} }

/* ---------- states ---------- */
.inert{pointer-events:none; opacity:var(--dim)}
.locked{pointer-events:none}
.dim{opacity:var(--dim)}
.right{box-shadow:0 0 0 6px var(--leaf), 0 8px 0 var(--btn-dark,var(--line)) !important; background:var(--leaf-soft) !important; opacity:1 !important}
.glow{box-shadow:0 0 0 6px var(--leaf), 0 8px 0 var(--btn-dark,var(--line)) !important; animation:breathe 1.2s ease-in-out infinite; opacity:1 !important; z-index:3}
.peekglow{box-shadow:0 0 0 6px var(--leaf) !important; opacity:1 !important}
.hand{position:absolute; right:-24px; bottom:-34px; font-size:64px; line-height:1; pointer-events:none; z-index:5}
.wobble{animation:wobble .3s linear}
.hop{animation:hop .3s ease}
.shake{animation:shake .3s linear}
.pawpop{animation:pawpop .2s ease}
@keyframes wobble{0%,100%{transform:rotate(0)}17%{transform:rotate(-4deg)}33%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}67%{transform:rotate(4deg)}83%{transform:rotate(-4deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes popin{from{transform:scale(.6)}to{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes pawpop{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes wag{0%,100%{transform:rotate(0)}33%{transform:rotate(-6deg)}66%{transform:rotate(6deg)}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(110vh) rotate(200deg)}}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-120px);opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--pop), 0 6px 0 var(--line)}50%{box-shadow:0 0 0 6px var(--pop), 0 6px 0 var(--line)}}
@keyframes starin{from{transform:scale(.4)}to{transform:scale(1)}}

/* ---------- general screens ---------- */
.screen{max-width:860px; margin:0 auto; padding:0 20px 40px; position:relative}
.head{min-height:88px; display:flex; align-items:center; gap:16px; padding-left:76px} /* + 20px screen padding = clear of the 🏠 */
.chip{background:var(--panel); border-radius:var(--r-pill); padding:10px 18px; font-size:22px; font-weight:600; box-shadow:0 4px 0 var(--line); white-space:nowrap}
.chip .st{color:var(--gold)}
.panel{background:var(--panel); border-radius:var(--r-xl); padding:22px; box-shadow:0 8px 0 var(--line)}
.warn{background:var(--hmm-soft); border-radius:var(--r-md); padding:12px 16px; font-size:18px; margin:10px 0}
.center{text-align:center}
.pipface{width:88px; height:88px; border-radius:50%; background:var(--panel-2); border:3px solid var(--line);
  display:grid; place-items:center; font-size:64px; line-height:1; flex:0 0 auto}
.pipface.wag{animation:wag .3s ease}

/* ---------- home ---------- */
.home-top{display:flex; justify-content:flex-end; align-items:center; min-height:84px; padding-left:96px}
.home-grid{display:block}
.hero{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.greet{font-size:24px; font-weight:600; margin:8px 0 0}
.pipcard{display:flex; align-items:center; gap:12px; background:var(--panel); border-radius:var(--r-lg); padding:10px 16px 10px 10px; box-shadow:var(--card-lift); max-width:380px}
.pipcard .pc-text{font-size:22px; font-weight:600}
.keep{display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; margin:18px 0 0; text-align:left;
  background:var(--panel); border-radius:var(--r-lg); box-shadow:var(--card-lift); padding:12px 14px 12px 20px; font-size:22px; font-weight:600; min-height:72px}
.keep .go{background:var(--pop); color:var(--on-accent); border-radius:var(--r-md); min-width:64px; min-height:60px; display:grid; place-items:center; font-size:26px}
.banner{margin:18px 0 0; background:var(--leaf-soft); border-radius:var(--r-lg); padding:14px 18px; font-size:24px; font-weight:600; text-align:center}
.playbtn{display:block; width:min(520px,100%); min-height:112px; margin:18px auto 4px; font-size:40px}
.playbtn .l2{display:block; font-size:24px; font-weight:600; margin-top:4px}
.trail{position:relative; display:grid; grid-template-columns:repeat(2,minmax(0,360px)); justify-content:center; gap:16px 36px; margin:18px 0 6px}
.trail svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:visible}
.stop{position:relative; z-index:1; min-height:102px; background:var(--panel); border-radius:var(--r-lg); box-shadow:var(--card-lift);
  display:grid; grid-template-columns:36px 60px 1fr; align-items:center; gap:10px; padding:10px 14px; text-align:left; border:4px solid transparent}
.stop.even{margin-top:34px}
.stop .num{width:36px; height:36px; border-radius:50%; background:var(--sky); color:var(--on-accent); display:grid; place-items:center; font-weight:700; font-size:18px}
.stop .lem{font-size:52px; line-height:1}
.stop .nm{font-size:var(--fs-label); font-weight:600; display:block}
.stop .sb{font-size:18px; color:var(--muted); display:block}
.stop .stars{color:var(--gold); font-size:22px; letter-spacing:2px; display:block; min-height:4px}
.stop .stars .off{color:var(--muted)}
.stop .mini{position:absolute; right:10px; bottom:6px; font-size:28px; line-height:1}
.stop.next{border-color:var(--pop)}
.sticker{position:absolute; top:-14px; right:-10px; background:var(--pop); color:var(--on-accent); font-weight:700; font-size:18px; padding:4px 12px; border-radius:12px; transform:rotate(8deg)}
.stop.lockd{opacity:.55}
.homebtns{display:flex; flex-direction:column; align-items:center; gap:18px; margin:18px 0 6px}
.parkbtn{min-height:72px}
.grown{position:relative; overflow:hidden; background:transparent; border:2px dashed var(--line); border-radius:14px; min-height:60px; padding:8px 18px; color:var(--muted); font-size:18px}
.grown::after{content:""; position:absolute; left:0; bottom:0; height:5px; width:0; background:var(--pop)}
.grown.holding::after{width:100%; transition:width 2s linear}
@media (orientation:landscape) and (min-width:900px){
  .screen.home{max-width:1140px}
  .home-grid{display:grid; grid-template-columns:380px 1fr; grid-template-rows:auto 1fr; column-gap:30px; align-items:start}
  .home-grid .hcol-l{grid-column:1; grid-row:1}
  .home-grid .hcol-r{grid-column:2; grid-row:1 / span 2}
  .home-grid .homebtns{grid-column:1; grid-row:2; margin-top:0}
  .home-grid .trail{margin-top:0}
  .home-grid .hero{flex-direction:column; align-items:flex-start}
}

/* ---------- play frame ---------- */
.play{display:flex; flex-direction:column; position:relative; max-width:1140px; margin:0 auto; overflow:hidden;
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.topbar{flex:0 0 88px; display:flex; align-items:center; gap:16px; padding:0 16px 0 96px; min-width:0}
.paws{display:flex; gap:8px; min-width:0; flex-wrap:nowrap}
.paw{width:clamp(26px,4.2vw,40px); height:clamp(26px,4.2vw,40px); border-radius:50%; display:grid; place-items:center; font-size:clamp(14px,2.4vw,22px); border:3px dashed var(--line); flex:0 0 auto; background:transparent}
.paw span{opacity:.25}
.paw.cur{border:4px solid var(--pop)}
.paw.gold{background:var(--gold-fill); border:3px solid var(--gold)} .paw.gold span{opacity:1}
.paw.plain{background:var(--panel); border:3px solid var(--leaf)} .paw.plain span{opacity:1}
.piprow{flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:2px 16px 10px}
.bubble{flex:1; min-width:0; position:relative; background:var(--panel); border-radius:var(--r-lg); padding:12px 22px; min-height:84px;
  font-size:var(--fs-pip); font-weight:600; line-height:1.2; display:flex; align-items:center; gap:14px; box-shadow:0 6px 0 var(--line)}
.bubble::after{content:""; position:absolute; right:-16px; top:50%; margin-top:-12px; border-style:solid; border-width:12px 0 12px 16px; border-color:transparent transparent transparent var(--panel)}
.bubble.hmm{background:var(--hmm-soft)} .bubble.hmm::after{border-left-color:var(--hmm-soft)}
.askchip{font-size:56px; line-height:1; background:var(--panel-2); border-radius:var(--r-md); min-width:72px; min-height:72px; display:grid; place-items:center; flex:0 0 auto}
.askchip:empty{display:none}
.hearbtn{width:72px; height:72px; min-height:72px; padding:0; border-radius:50%; font-size:32px; flex:0 0 auto}
.main{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:clamp(14px,3dvh,34px); padding:6px 16px 18px; position:relative}
.stage,.answer{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; min-height:0; min-width:0; position:relative}
.stage{flex:0 1 auto}
.answer{flex:0 0 auto}
@media (orientation:landscape) and (min-width:900px){
  .main{flex-direction:row; align-items:center}
  .main .stage{flex:0 0 56%}
  .main .answer{flex:1 1 44%}
  .main.col{flex-direction:column}
  .main.col .stage{flex:0 1 auto}
  .main.col .answer{flex:0 0 auto}
}
.ready{min-width:min(300px,80vw); min-height:clamp(84px,10dvh,120px); font-size:40px}
.skipper{position:absolute; left:0; right:0; top:88px; bottom:0; z-index:40}
.demoveil{position:absolute; left:0; right:0; top:88px; bottom:0; z-index:45; background:rgba(255,255,255,.08)}
.skipbtn{position:absolute; right:16px; top:200px; z-index:60; min-height:64px; font-size:24px}
.dhand{position:fixed; z-index:70; font-size:72px; line-height:1; pointer-events:none; transition:left .5s ease, top .5s ease, transform .15s}
.dhand.press{transform:scale(.85)}
.flyer{position:fixed; z-index:30; pointer-events:none; line-height:1; transition:transform .25s ease}
.dragghost{position:fixed; z-index:80; pointer-events:none; font-size:72px; line-height:1; transform:translate(-50%,-50%)}
.introcard{text-align:center; background:var(--panel); border-radius:var(--r-xl); padding:24px 30px; box-shadow:0 8px 0 var(--line); max-width:620px}
.introcard .bigem{font-size:clamp(80px,11dvh,120px); line-height:1}
.introcard p{font-size:var(--fs-pip); font-weight:600; margin:12px 0 22px}
.introcard .btn{min-height:80px; font-size:32px}

/* ---------- Who Peeked ---------- */
.burrow{width:clamp(150px,24dvh,260px); height:clamp(150px,24dvh,260px); border-radius:50%; background:var(--grass); display:grid; place-items:center; flex:0 0 auto; transition:width .25s, height .25s}
.burrow.small{width:clamp(100px,14dvh,180px); height:clamp(100px,14dvh,180px)}
.burrow-in{width:84%; height:84%; border-radius:50%; background:rgba(43,33,64,.85); display:grid; place-items:center; overflow:hidden}
.peekpet{font-size:clamp(70px,11dvh,120px); line-height:1}
.peekpet.in{animation:popin .18s ease-out}
.burrow.small .peekpet{font-size:clamp(56px,8dvh,90px)}
.peeklabel{font-size:30px; font-weight:600; min-height:36px; line-height:1.2}
.slots{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
.slot{width:clamp(76px,9dvh,96px); height:clamp(76px,9dvh,96px); border:3px dashed var(--sky); border-radius:var(--r-sm); background:var(--sky-soft); position:relative; display:grid; place-items:center; font-size:clamp(48px,6dvh,64px); line-height:1}
.slot b{position:absolute; top:3px; left:7px; font-size:22px; color:var(--sky); line-height:1}
.slot.filled{border-style:solid; border-color:var(--leaf); background:var(--leaf-soft)}
.slot .sp.in{animation:popin .18s ease-out}
.choices{display:flex; flex-wrap:wrap; gap:14px; justify-content:center}
.choice{width:clamp(96px,11dvh,112px); min-height:clamp(96px,11dvh,112px); padding:6px 4px; --es:clamp(56px,7dvh,76px)}
.choices.many .choice{width:100px; min-height:100px; --es:64px}
.choice.used{opacity:.5}
.choice.used::before{content:"✓"; position:absolute; top:4px; right:8px; color:var(--leaf); font-size:24px; font-weight:700}

/* ---------- Hide and Seek ---------- */
.doors{display:grid; gap:20px; justify-content:center}
.door{width:var(--dsz); height:var(--dsz); position:relative; border-radius:var(--r-md); perspective:700px; background:#FFF7EC; box-shadow:inset 0 0 0 4px rgba(43,33,64,.3)}
.door .room{position:absolute; inset:0; border-radius:var(--r-md); display:flex; flex-direction:column; align-items:center; justify-content:center; padding-left:26%; color:#2B2140; --es:min(88px, calc(var(--dsz) * .46))}
.door .room small{font-size:var(--fs-label); font-weight:600}
.door .room .flower{--es:28px; opacity:.8}
.door .leafp{position:absolute; inset:0; border-radius:var(--r-md); background:var(--dc);
  background-image:repeating-linear-gradient(180deg, transparent 0 22%, rgba(43,33,64,.12) 22% calc(22% + 3px));
  box-shadow:inset 0 0 0 4px rgba(43,33,64,.3); transform-origin:left center; transition:transform .22s ease}
.door .knob{position:absolute; right:14%; top:50%; width:20px; height:20px; margin-top:-10px; border-radius:50%; background:#2B2140; opacity:.55}
.door.open .leafp{transform:rotateY(-70deg)}
.door.right .room{background:var(--leaf-soft)}

/* ---------- Pet Helper ---------- */
.strip{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; background:var(--panel); border-radius:var(--r-lg); padding:10px 14px; box-shadow:0 6px 0 var(--line)}
.step{display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 12px; border-radius:var(--r-md); border:3px solid transparent}
.step .pair{font-size:clamp(40px,6dvh,72px); line-height:1; white-space:nowrap}
.step .lab{font-size:28px; font-weight:600}
.step.lit{background:var(--pop-soft); border-color:var(--pop)}
.step.ok .lab::after{content:" ✓"; color:var(--leaf)}
.shelf{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding:6px 14px 16px; border-bottom:14px solid var(--line); border-radius:0 0 8px 8px}
.treat{width:clamp(80px,9dvh,96px); height:clamp(80px,9dvh,96px); --es:clamp(48px,6dvh,60px)}
.treat.sel{transform:translateY(-8px); box-shadow:0 0 0 5px var(--pop), 0 8px 0 var(--btn-dark)}
.treat.spent{background:transparent; box-shadow:none; border:3px dashed var(--line)}
.treat.spent .em{visibility:hidden}
.petcards{display:flex; gap:16px; justify-content:center; flex-wrap:wrap}
.petcard{width:clamp(120px,15vw,150px); height:clamp(130px,16dvh,170px); --es:clamp(64px,8dvh,88px)}
.petcards.target .petcard:not(.inert){outline:4px dashed var(--pop); outline-offset:4px}
.badges{position:absolute; top:6px; right:6px; display:flex; font-size:36px; line-height:1}
@media (orientation:landscape) and (min-width:900px){ .petcards{display:grid; grid-template-columns:repeat(2,auto)} }

/* ---------- patterns ---------- */

.pen .in{flex:1; display:flex; flex-wrap:wrap; gap:8px; align-content:center; justify-content:center; padding:10px; --es:clamp(48px,6dvh,64px)}

.wpet{width:clamp(88px,10dvh,104px); height:clamp(88px,10dvh,104px); --es:clamp(52px,6.5dvh,64px); justify-content:center}

/* ---------- who am I ---------- */

.wwrap.crossed .card .em,.wwrap.crossed .card small,.wwrap.ruled .card .em,.wwrap.ruled .card small{opacity:var(--dim)}
.wwrap.crossed .card::after,.wwrap.ruled .card::after{content:""; position:absolute; inset:16px; pointer-events:none;
  background:linear-gradient(45deg, transparent calc(50% - 3px), var(--xc) calc(50% - 3px), var(--xc) calc(50% + 3px), transparent calc(50% + 3px)),
             linear-gradient(-45deg, transparent calc(50% - 3px), var(--xc) calc(50% - 3px), var(--xc) calc(50% + 3px), transparent calc(50% + 3px))}
.wwrap.crossed{--xc:var(--muted)} .wwrap.ruled{--xc:var(--sky)}

.bed .line{font-family:var(--font-display); font-size:34px; text-align:center; margin:6px 0}
.bed .today{font-size:24px; text-align:center; margin:22px 0}

/* ---------- pet park ---------- */
.meadowpanel{background:linear-gradient(180deg, var(--meadow), var(--grass)); border-radius:var(--r-xl); padding:20px; position:relative; overflow:hidden; box-shadow:0 8px 0 var(--line)}

.plot .pn{font-size:var(--fs-label); font-weight:600}

.saybub{position:absolute; top:-8px; left:50%; transform:translateX(-50%); background:var(--panel); border:3px solid var(--line); border-radius:var(--r-md); padding:4px 12px; font-size:20px; font-weight:600; white-space:nowrap; z-index:3}

@media (max-width:640px){ .plots{grid-template-columns:repeat(2,minmax(0,1fr))} .trail{grid-template-columns:minmax(0,1fr)} .stop.even{margin-top:0} }

/* ---------- grown-ups ---------- */
.gu{max-width:760px}
.gcard{background:var(--panel); border-radius:var(--r-lg); padding:16px 20px; margin:14px 0; box-shadow:var(--card-lift)}

.sw{display:flex; width:100%; min-height:64px; align-items:center; justify-content:space-between; gap:12px; font-size:20px; text-align:left}

.sw .knob::after{content:""; position:absolute; top:5px; left:5px; width:34px; height:34px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.25); transition:left .15s}
.sw[aria-checked="true"] .knob{background:var(--leaf)}
.sw[aria-checked="true"] .knob::after{left:33px}
.muted{color:var(--muted)}
.resetbox{border:2px solid var(--pop)}
.row{display:flex; gap:14px; flex-wrap:wrap; align-items:center}
button[disabled]{opacity:.5; pointer-events:none}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
  .btn:active,.tile:active{transform:none !important; filter:brightness(.92)}
  .glow{box-shadow:0 0 0 8px var(--leaf) !important}
  .door.open .leafp{visibility:hidden}
  .pens.pulse .pen{border-color:var(--pop)}
  .treat.sel,.wpet.sel{transform:none}
}
.wob-rm{outline:3px dashed var(--pop); outline-offset:3px}

<body>
<div id="app"></div>
<div id="pip-live" class="sr" aria-live="polite"></div>

<!-- REQUIRED: connects this game to the homepage. -->
<script src="../../shared/hub.js" data-game="pet-puzzle-pals"></script>

<script>
"use strict";
/* =====================================================================
   Pet Puzzle Pals — memory and logic practice with Pip the puppy.
   Plain JS, no build step. Progress: Hub.save/Hub.load ("progress",
   "rounds" (one per level), "session"). Settings: Hub.setting (see games.js).
   ===================================================================== */
const GAME_ID = "pet-puzzle-pals";

/* ---------------- settings ---------------- */
const DEFAULTS = {
  unlockAllLevels: true, voice: true, speechRate: 0.9, soundEffects: true,
  roundsPerSession: 2, itemsPerRound: 8, petBreak: true, memoryPace: "normal",
  memoryLevelOffset: 0, adaptiveMemory: true, allowReplay: false, petLabels: true,
  showDemos: true, crossOff: true,
};
function setting(key) {
  const fb = DEFAULTS[key];
  try { if (window.Hub && typeof Hub.setting === "function") return Hub.setting(key, fb); } catch (e) {}
  return fb;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const S = {
  unlockAll: () => setting("unlockAllLevels") !== false,
  voice: () => setting("voice") !== false,
  rate: () => { const r = Number(setting("speechRate")); return isFinite(r) && r > 0 ? clamp(r, 0.7, 1.1) : 0.9; },
  sound: () => setting("soundEffects") !== false,
  rounds: () => clamp(Math.round(Number(setting("roundsPerSession")) || 2), 1, 3),
  items: () => { const n = Number(setting("itemsPerRound")); return n === 6 || n === 10 ? n : 8; },
  petBreak: () => setting("petBreak") !== false,
  pace: () => (setting("memoryPace") === "slow" ? "slow" : "normal"),
  offset: () => clamp(Math.round(Number(setting("memoryLevelOffset")) || 0), -1, 1),
  adaptive: () => setting("adaptiveMemory") !== false,
  replay: () => setting("allowReplay") === true,
  labels: () => setting("petLabels") !== false,
  demos: () => setting("showDemos") !== false,
  crossOff: () => setting("crossOff") !== false,
};
const PACE_MS = () => (S.pace() === "slow" ? 1600 : 1100);
const PACE_MULT = () => (S.pace() === "slow" ? 1600 / 1100 : 1);
const kidName = () => String((window.HUB && window.HUB.name) || "").trim();

/* ---------------- tiny helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const RM = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
const art = w => (/^[aeiou]/i.test(w) ? "an" : "a");
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

/* Screen generations: every screen / item change bumps GEN, clears pending
   timers and stops speech, so stale async flows quietly stop. */
let GEN = 0;
const timers = new Set();
function later(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; }
function sleep(ms) { return new Promise(r => later(r, ms)); }
function live(p) { const g = GEN; return Promise.resolve(p).then(v => (g === GEN ? v : new Promise(() => {}))); }
function bump() { GEN++; timers.forEach(clearTimeout); timers.clear(); Voice.cancel(); }
// Debounce only a repeat tap on the SAME element (double-fire); a tap on a different target is never dropped.
function dbl(el, ms) { if (!el) return false; const n = performance.now(); if (n - (el._tapAt || 0) < (ms || 250)) return true; el._tapAt = n; return false; }

/* ---------------- storage ---------------- */
const store = {
  load(k, fb) { try { return (window.Hub && typeof Hub.load === "function") ? Hub.load(k, fb) : fb; } catch (e) { return fb; } },
  save(k, v) { try { return !!(window.Hub && typeof Hub.save === "function" && Hub.save(k, v)); } catch (e) { return false; } },
};
const storageOK = store.save("probe", 1);

/* ---------------- voice ---------------- */
const liveRegion = document.getElementById("pip-live");
const Voice = {
  ok: ("speechSynthesis" in window) && (typeof SpeechSynthesisUtterance !== "undefined"),
  v: null,
  init() {
    if (!this.ok) return;
    const choose = () => {
      try {
        const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
        const prefs = [/samantha/i, /aria/i, /jenny/i, /ava/i, /allison/i, /zira/i, /susan/i, /victoria/i, /karen/i, /moira/i, /tessa/i, /serena/i, /female/i, /google us english/i, /google uk english female/i];
        for (const p of prefs) { const f = vs.find(v => p.test(v.name)); if (f) { this.v = f; return; } }
        this.v = vs[0] || null;
      } catch (e) {}
    };
    choose();
    try { speechSynthesis.addEventListener("voiceschanged", choose); } catch (e) { try { speechSynthesis.onvoiceschanged = choose; } catch (e2) {} }
  },
  on() { return this.ok && S.voice(); },
  cancel() { if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} },
  mirror(t) { if (liveRegion && t) liveRegion.textContent = t; },
  // Returns a promise that resolves when speech ends (never blocks taps).
  // opts.queue: don't cancel what is playing. opts.wait: when voice is off,
  // wait 2.5 s per sentence instead of resolving at once.
  say(text, opts) {
    opts = opts || {};
    text = String(text || "").trim();
    this.mirror(text);
    if (!text) return Promise.resolve();
    if (!this.on()) {
      const n = opts.wait ? 2500 * Math.max(1, (text.match(/[.!?]+(\s|$)/g) || [1]).length) : 0;
      return new Promise(r => setTimeout(r, n));
    }
    return new Promise(res => {
      let done = false, safety = null;
      const fin = () => { if (!done) { done = true; if (safety) clearTimeout(safety); res(); } };
      try {
        if (!opts.queue) speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        if (this.v) { u.voice = this.v; u.lang = this.v.lang; } else u.lang = "en-US";
        u.rate = S.rate(); u.pitch = 1.1;
        u.onend = fin; u.onerror = fin;
        speechSynthesis.speak(u);
        safety = setTimeout(fin, 2000 + text.length * 95 / S.rate() + (opts.queue ? 3000 : 0));
      } catch (e) { fin(); }
    });
  },
  unlock() {
    if (!this.on()) return;
    try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  },
};
Voice.init();

/* ---------------- sound (Web Audio, synthesised) ---------------- */
const Sound = {
  ctx: null, master: null,
  ensure() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
    } catch (e) { return null; }
    return this.ctx;
  },
  tone(f, at, dur, type, gain, fEnd) {
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, gain) {
    const c = this.ctx, t = c.currentTime, len = Math.floor(c.sampleRate * dur);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b;
    const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2000;
    const g = c.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.02);
  },
  play(name, i) {
    if (!S.sound()) return;
    if (!this.ensure()) return;
    try {
      switch (name) {
        case "chime": this.tone(880, 0, 0.11, "sine", 0.12); this.tone(1320, 0.11, 0.11, "sine", 0.12); break;
        case "hmm": this.tone(392, 0, 0.18, "triangle", 0.06, 330); break;
        case "pop": this.tone(400, 0, 0.08, "sine", 0.08, 800); break;
        case "click": this.noise(0.025, 0.1); break;
        case "cross": this.tone(300, 0, 0.06, "sine", 0.05); break;
        case "star": this.tone([1046.5, 1318.5, 1568][i || 0], 0, 0.14, "sine", 0.1); break;
        case "done": [523.25, 659.25, 783.99, 1046.5].forEach((f, k) => this.tone(f, k * 0.09, 0.09, "triangle", 0.1)); break;
        case "heart": this.tone(660, 0, 0.12, "sine", 0.06); break;
        case "bedtime": [783.99, 659.25, 523.25].forEach((f, k) => this.tone(f, k * 0.3, 0.3, "sine", 0.06)); break;
      }
    } catch (e) {}

/* ---- M2 Hide and Seek ---- */
const DOORC = ["#F9A8D4", "#FDE68A", "#A7F3D0", "#BFDBFE", "#DDD6FE", "#FECACA", "#FED7AA", "#BBF7D0", "#E9D5FF"];
ACT.hide = ctx => {

  const dEls = occupant.map((p, i) => el("button", { class: "door", "aria-label": `Door ${i + 1}`, "data-i": i, style: `--dc:${DOORC[i]}` },
    el("div", { class: "room" }, p ? el("span", { class: "em", "aria-hidden": "true" }, p) : el("span", { class: "em flower", "aria-hidden": "true" }, "🌼"), p && S.labels() ? el("small", null, nm(p)) : null),
    el("div", { class: "leafp" }, el("span", { class: "knob" }))));

  const setOpen = (d, o) => d.classList.toggle("open", o);
  async function peekAll(ms) {
    lock(dEls, true, true);

    Sound.play("pop");
    await sleep(ms);

    Sound.play("click");
    await sleep(250);
  }

  };
  dEls.forEach((d, i) => d.addEventListener("click", () => tapDoor(d, i)));
  async function tapDoor(d, i) {
    if (!(ctx.phase === "answer" || ctx.phase === "showme") || d.hasAttribute("inert")) return;

/* ---- M3 Pet Helper ---- */
ACT.helper = ctx => {

  const stepText = i => `${lab(i)}, give the ${nm(steps[i].pet)} ${TREAT_SAY[steps[i].treat]}.`;
  const stepEls = steps.map((s, i) => el("div", { class: "step" }, el("div", { class: "pair", "aria-label": stepText(i) }, `${s.treat} ➜ ${s.pet}`), el("div", { class: "lab" }, lab(i))));
  const strip = el("div", { class: "strip", hidden: true }, ...stepEls);
  const tEls = shelf.map(t => el("button", { class: "tile treat", "aria-label": TREAT[t], "data-e": t }, el("span", { class: "em", "aria-hidden": "true" }, t)));
  const shelfEl = el("div", { class: "shelf" }, ...tEls);
  const pEls = pets.map(p => el("button", { class: "tile petcard", "aria-label": nm(p), "data-e": p }, el("span", { class: "badges", "aria-hidden": "true" }), el("span", { class: "em", "aria-hidden": "true" }, p), el("small", null, nm(p))));
  const pcs = el("div", { class: "petcards" }, ...pEls);
  const ready = el("button", { class: "btn pop ready" }, "Ready? 👀");
  ctx.stage.append(strip, shelfEl); ctx.answer.append(pcs, ready);
  lock(tEls, true); lock(pEls, true);
  let done = 0, sel = null, answered = false;
  ctx.span = n;
  ctx.phase = "ready";
  ctx.say("Tap Ready, then listen to the job.");
  async function readJob() {
    strip.hidden = false; ctx.bubble("Listen… 👂");
    for (let i = 0; i < n; i++) {
      stepEls[i].classList.add("lit");
      await live(Voice.say(stepText(i), { wait: true, queue: i > 0 }));
      stepEls[i].classList.remove("lit");
    }
    await sleep(300); strip.hidden = true;
  }
  function unlockAvail() { tEls.forEach(t => setInert(t, t.classList.contains("spent"), t.classList.contains("spent"))); lock(pEls, false); }
  function answerPhase() {
    ctx.phase = "answer"; unlockAvail(); ctx.say("Your turn!");
    if (S.replay() && !answered) ctx.setHear(async () => {
      if (ctx.phase !== "answer" || answered) return;
      ctx.phase = "showing"; ctx.setHear(null); lock(tEls, true); lock(pEls, true);
      await readJob(); answerPhase();
    });
  }
  ready.onclick = async () => {
    if (ctx.phase !== "ready") return;
    ready.remove(); ctx.phase = "showing"; Voice.cancel();
    await readJob(); answerPhase();
  };
  function select(t) { if (sel) sel.classList.remove("sel"); sel = t; if (t) t.classList.add("sel"); pcs.classList.toggle("target", !!t); }
  const tFor = e => tEls.find(t => t.dataset.e === e), pFor = e => pEls.find(p => p.dataset.e === e);
  tEls.forEach(t => {
    t.addEventListener("click", () => {
      if (recentDrag(t)) return;
      if (!(ctx.phase === "answer" || ctx.phase === "showme") || t.hasAttribute("inert")) return;
      if (!answered) { answered = true; ctx.setHear(null); }
      if (sel === t) { if (ctx.phase !== "showme") select(null); return; }
      select(t);
      if (ctx.phase === "showme") { unglow(t); glow(pFor(steps[done].pet)); }

/* ---- L1 What Comes Next? / Tricky Patterns ---- */
ACT.next = ctx => {
  const it = ctx.content, n = it.tiles.length;
  F.main.classList.add("col");
  const box = el("div", { class: "prow" });
  ctx.stage.append(box);
  const nameOf = t => tileName(t, it.kind);
  const tileEls = it.tiles.map(t => (t === "?" ? el("div", { class: "ptile q", "aria-label": "missing pet" }, el("span", { class: "qm" }, "?"))
    : el("div", { class: "ptile", role: "img", "aria-label": tileLabel(t) }, petSpan(t))));
  let lastW = 0, bracketsOn = false;
  // Tile size from the real width of the play area (not the empty stage). Keep one line
  // whenever tiles can stay >= 52px; only very narrow screens wrap, at a repeat boundary.
  function layoutRow(force) {
    const W = Math.max(260, (F.main.clientWidth || 760) - 72);
    if (!force && Math.abs(W - lastW) < 2) return;
    lastW = W;
    let per = n, ts = Math.min(88, (W - 8 * (n - 1)) / n);
    if (ts < 52) { per = Math.max(it.unit, Math.floor((W + 8) / 60)); per -= per % it.unit; per = Math.max(it.unit, per); ts = Math.min(88, (W - 8 * (per - 1)) / per); }
    ts = Math.max(48, Math.floor(ts));
    box.innerHTML = "";
    let line = null;
    tileEls.forEach((te, i) => {
      if (i % per === 0) { line = el("div", { class: "pline", style: `--ts:${ts}px` }); box.append(line); }
      te._line = line; line.append(te);
    });
    if (bracketsOn) drawBrackets();
  }
  layoutRow(true);
  const onResize = () => { if (!box.isConnected) { window.removeEventListener("resize", onResize); return; } requestAnimationFrame(() => layoutRow()); };
  window.addEventListener("resize", onResize);
  const cEls = it.choices.map(c => el("button", { class: "tile pchoice", "aria-label": tileLabel(c), "data-ok": sameTile(c, it.ans) ? "1" : null }, petSpan(c)));
  ctx.answer.append(el("div", { class: "choices" }, ...cEls));
  const instr = it.q === n - 1 ? "What comes next?" : "What is missing?";
  ctx.phase = "answer";
  ctx.say(instr);
  ctx.setHear(() => ctx.say(instr, { hmm: F.bubble.classList.contains("hmm") }));
  async function rhythm() {
    for (let i = 0; i < n; i++) {
      tileEls[i].classList.add("lit");
      if (Voice.on()) await live(Voice.say(nameOf(it.full[i]) + (i === n - 1 ? "!" : ","), { queue: true })); else await sleep(450);
      tileEls[i].classList.remove("lit");
    }
  }
  let hrTok = 0;
  const stopHint = () => { hrTok++; tileEls.forEach(t => t.classList.remove("lit")); };
  async function hintRead() {
    const my = ++hrTok;
    for (let i = 0; i < n; i++) {
      if (my !== hrTok) return;
      tileEls[i].classList.add("lit");
      const word = i === it.q ? "what?" : nameOf(it.full[i]) + ((i + 1) % it.unit === 0 ? "…" : ",");
      if (Voice.on()) await live(Voice.say(word, { queue: true })); else await sleep(450);
      tileEls[i].classList.remove("lit");
      if ((i + 1) % it.unit === 0) await sleep(250);
    }
    if (my === hrTok) await live(Voice.say(instr, { queue: true }));
  }
  function drawBrackets() {
    bracketsOn = true;
    for (let k = 0; (k + 1) * it.unit <= n; k++) {
      const a = k * it.unit, b = a + it.unit - 1;
      let ok = true; for (let i = a; i <= b; i++) if (i === it.q) ok = false;
      if (!ok || tileEls[a]._line !== tileEls[b]._line) continue;
      const left = tileEls[a].offsetLeft, right = tileEls[b].offsetLeft + tileEls[b].offsetWidth;
      tileEls[a]._line.append(el("div", { class: "bracket", style: `left:${left}px;width:${right - left}px` }));
    }
  }
  cEls.forEach((b, i) => b.addEventListener("click", async () => {
    if (!(ctx.phase === "answer" || ctx.phase === "showme") || b.hasAttribute("inert")) return;
    if (dbl(b)) return;
    const c = it.choices[i];
    if (sameTile(c, it.ans)) {
      ctx.phase = "done"; stopHint(); unglow(b); b.classList.add("right"); lock(cEls.filter(x => x !== b), true, true);
      const qt = tileEls[it.q];
      fly(b.querySelector(".em"), qt, c.e, () => {});
      qt.innerHTML = ""; qt.append(petSpan(c)); qt.classList.add("solved"); qt.setAttribute("aria-label", tileLabel(c));
      ctx.complete({ praise: praise("next"), first: "Yes!", during: rhythm, cap: 12000 });
      return;
    }
    if (ctx.phase === "showme") return;
    ctx.logErr("item"); wobble(b, true); setInert(b, true);
    const step = ctx.miss();
    if (step === "hint") {
      ctx.phase = "answer"; drawBrackets(); ctx.bubble(instr, true); Voice.cancel(); hintRead();
    } else {
      ctx.phase = "showme"; stopHint(); lock(cEls, true);
      const unitNames = it.full.slice(0, it.unit).map(nameOf).join(", ");
      ctx.say(`The pattern is ${unitNames}.`, { speak: `The pattern is ${unitNames}. So it is ${nameOf(it.ans)}. Tap the glowing one.` });
      glow(cEls.find(x => x.dataset.ok === "1"));

/* =====================================================================
   ROUND DONE (3.12), PET BREAK (3.13), ONE MORE (3.14), BEDTIME (3.15)
   ===================================================================== */
function nextLevelAfter(n) { return lv(n).mastered ? Math.min(8, n + 1) : n; }

function confetti() {

}

/* =====================================================================
   PET PARK (3.16)

/* =====================================================================
   GROWN-UPS (3.17)

function writeHubSetting(key, val) {

  s.games = s.games || {}; s.games[GAME_ID] = s.games[GAME_ID] || {}; s.games[GAME_ID][key] = val;

}
function sparkline(hist) {

  const last = pts[pts.length - 1];

  wrap.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--sky)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--sky)"/></svg>`;
